## Project configuration of mhdpy. The choices made here are recorded in the decision briefs (docs/decisions/); the
## sub-decision behind each section is noted.

[project]
name = "mhdpy"
version = "0.1.0.dev0"
description = "A Python-first package for astrophysical (magneto)hydrodynamics."
readme = "README.md"
authors = [{ name = "Thom van Essen" }]
## D01.3: BSD-3-Clause, plus the licences of third-party code reused in mhdpy.
license = "BSD-3-Clause"
license-files = ["LICENSE", "LICENSES/*.txt"]
## D01.2: Python 3.13 and 3.14, under a rolling three-year support window (SPEC 0).
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
## D01.6: runtime dependencies get the version current at the time they are added as lower bound, no upper bound.
dependencies = [
    "numpy>=2.5.4",
]

## D02.7: everything needed to run the tests that ship with the package: pip install "mhdpy[test]", then
## pytest --pyargs mhdpy. The dev group below includes this extra, so a plain "uv sync" installs it for development.
[project.optional-dependencies]
test = [
    "hypothesis>=6.168.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    ## The uncompiled kernels import cython (Cython's pure Python mode, D04.1), so testing them with
    ## MHDPY_KERNELS=uncompiled needs it.
    "cython>=3.3.0",
]

## D01.6: development tools live in dependency groups, which are never installed for users.
[dependency-groups]
dev = [
    "mhdpy[test]",
    "pyright>=1.1.414",
    "ruff>=0.17.0",
    "cython>=3.3.0",
    "meson>=1.12.1",
    "meson-python>=0.22.1",
    "ninja>=1.13.2",
    "nox>=2026.8.17",
]

## D04.5: meson-python builds the package and compiles its Cython kernels (superseding D01.5, uv_build).
[build-system]
requires = ["meson-python>=0.22.1", "cython>=3.3.0"]
build-backend = "mesonpy"

## D01.7: ruff formats and lints everything at 120 characters.
[tool.ruff]
line-length = 120
## Experiments in the decision briefs are standalone scripts with their own environments (D01.6), and the
## E01.2 style sample deliberately predates the house style. They are frozen evidence, not package code.
extend-exclude = ["docs/decisions"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "E",   ## pycodestyle errors
    "W",   ## pycodestyle warnings
    "F",   ## pyflakes
    "I",   ## import sorting
    "B",   ## bugbear: likely bugs and design problems
    "UP",  ## pyupgrade: modern syntax for the supported Python versions
    "NPY", ## NumPy-specific checks
    "D",   ## docstrings (pydocstyle)
]
ignore = [
    "E266", ## house style: comments start with a double hash, "## comment" (D01.7)
]

[tool.ruff.lint.pydocstyle]
## D01.10 / D01.11: standard NumPy docstring layout.
convention = "numpy"

## D01.8: pyright, strict for framework and package interfaces. Kernel sources are not checked and are typed through
## .pyi stubs (D04).
[tool.pyright]
include = ["src", "noxfile.py"]
## D04: pyright cannot interpret Cython's types in kernel sources, so their diagnostics are ignored. "ignore" rather
## than "exclude", because the editor (Pylance) still reports excluded files while they are open. Each kernel is typed
## for its callers by a .pyi stub next to it.
ignore = ["src/mhdpy/_backend.py"]
## The lowest supported Python version (D01.2), so that no newer language feature slips in unnoticed.
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

## D01.9: pytest. Tests live next to the component they test, inside the package (D01.4). Every tests/ folder is a
## package with its own __init__.py, so test modules in different components may share a name, and an installed copy
## can be tested with a plain "pytest --pyargs mhdpy". The test tiers of D02.5 are defined in src/mhdpy/conftest.py, which
## pytest only loads at start-up if the test path points at the package directory itself.
[tool.pytest.ini_options]
testpaths = ["src/mhdpy"]

## D02.8: 100 % line and branch coverage of the package code, measured on the fast tier. Tests and the test configuration
## are not product code and are left out. Code that cannot be tested is excluded with "# pragma: no cover", followed on
## the same line by the reason. In CI, the measurements of all test jobs are combined before the minimum is enforced, so
## a platform-specific branch counts once it is covered on its own platform.
[tool.coverage.run]
branch = true
source = ["mhdpy"]
omit = ["*/tests/*", "*/conftest.py"]
relative_files = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

## meson-python's editable install rebuilds changed kernels when mhdpy is imported. It needs the build tools in the
## project's own environment for that, so mhdpy is built without an isolated build environment.
[tool.uv]
no-build-isolation-package = ["mhdpy"]

[tool.uv.sources]
mhdpy = { workspace = true }
