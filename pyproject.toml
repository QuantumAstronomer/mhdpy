## build: setuptools (B4D2), with the version from the tags of git by setuptools-scm (B4D6)
[build-system]
## setuptools 80, as setuptools-scm recommends, also reads the SPDX licence of PACK11 (from 77)
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "mhdpy"
## Python from 3.14 in both of its builds (B4D1), the floor rising as SPEC 0 drops versions (PACK08)
requires-python = ">=3.14"
## NumPy alone at run time, from the first release with wheels for 3.14 and 3.14t, without a cap (B4D4, PACK09)
dependencies = ["numpy>=2.3.2"]
## the version is derived from git at each build (PACK13)
dynamic = ["version"]
## the BSD licence of three clauses by its SPDX expression (B4D5, PACK11)
license = "BSD-3-Clause"
license-files = ["LICENSE"]

## the tools of development, which the published metadata leaves out and uv.lock fixes (B4D4)
[dependency-groups]
dev = [
    "pytest>=9.0",          ## 9.0 reads the native table [tool.pytest] and has the strict mode
    "pyright",              ## the judge of the types before each commit (CLAUDE.md §3.4)
    "import-linter>=2.16",  ## the check of the rule of imports (B1D5), with the contracts of [tool.importlinter]
    "packaging",            ## the parser of versions and specifiers in the tests of the metadata (PACK08, PACK09)
]

## setuptools builds from src/ alone (PACK01), so that no stale mhdpy.egg-info appears at the root
[tool.setuptools.packages.find]
where = ["src"]

## setuptools-scm acts only where this table is present
[tool.setuptools_scm]

## strict mode and the default mode of imports (CLAUDE.md §3.2)
[tool.pytest]
testpaths = ["tests"]
strict = true
## the third-party tests in reference-works/ stay uncollected, as the folder is read-only (CLAUDE.md §4.1)
addopts = ["--ignore=reference-works"]

## strict checking at the oldest Python that mhdpy supports (CLAUDE.md §3.2, PACK08)
[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

## the rule of imports (B1D2 to B1D4), each contract named after its requirement, which tests/test_package.py reads
[tool.importlinter]
root_packages = ["mhdpy", "tests"]

[[tool.importlinter.contracts]]
name = "The strata import none above them (PACK03)"
type = "layers"
layers = ["mhdpy.driver", "mhdpy.physics", "mhdpy.core", "mhdpy.mesh", "mhdpy.infrastructure"]

[[tool.importlinter.contracts]]
name = "The siblings within each stratum import each other without a cycle (PACK04)"
type = "acyclic_siblings"
ancestors = ["mhdpy.infrastructure", "mhdpy.mesh", "mhdpy.core", "mhdpy.physics", "mhdpy.driver"]

[[tool.importlinter.contracts]]
name = "The top package imports no stratum (PACK05)"
type = "forbidden"
## the top package as a module alone (as_packages below), since as a package it would hold the strata
source_modules = ["mhdpy"]
## each stratum with its descendants, which `**` alone leaves out
forbidden_modules = [
    "mhdpy.infrastructure", "mhdpy.infrastructure.**",
    "mhdpy.mesh", "mhdpy.mesh.**",
    "mhdpy.core", "mhdpy.core.**",
    "mhdpy.physics", "mhdpy.physics.**",
    "mhdpy.driver", "mhdpy.driver.**",
]
as_packages = false

[[tool.importlinter.contracts]]
name = "The tests of the infrastructure import no stratum above it (PACK06)"
type = "forbidden"
source_modules = ["tests.infrastructure"]
forbidden_modules = ["mhdpy.mesh", "mhdpy.core", "mhdpy.physics", "mhdpy.driver"]

[[tool.importlinter.contracts]]
name = "The tests of the mesh import no stratum above it (PACK06)"
type = "forbidden"
source_modules = ["tests.mesh"]
forbidden_modules = ["mhdpy.core", "mhdpy.physics", "mhdpy.driver"]

[[tool.importlinter.contracts]]
name = "The tests of the core import no stratum above it (PACK06)"
type = "forbidden"
source_modules = ["tests.core"]
forbidden_modules = ["mhdpy.physics", "mhdpy.driver"]

[[tool.importlinter.contracts]]
name = "The tests of the physics import no stratum above it (PACK06)"
type = "forbidden"
source_modules = ["tests.physics"]
forbidden_modules = ["mhdpy.driver"]
