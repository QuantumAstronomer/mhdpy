## Continuous integration of mhdpy (decision briefs D01 and D16). Runs on every push to main and on every pull request.
## Each check is a session of noxfile.py (D16.4), the same one that `uv run nox` runs locally; this workflow only decides
## where and in which combinations the sessions run.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

## A newer push to the same branch or pull request cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ## Formatting, linting and type checking (D01.7, D01.8). These do not depend on the platform, so Linux suffices.
  checks:
    name: Format, lint and type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run nox -s lint

  ## The fast test tier (D02.5) on both target platforms and every supported Python version (D01.1, D01.2). Coverage is
  ## measured here but enforced only after the measurements of all jobs are combined, in the coverage job (D02.8).
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }}, ${{ matrix.kernels }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.13", "3.14"]
        kernels: [compiled, uncompiled]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      ## The session sets MHDPY_KERNELS and writes its coverage to a file named after the platform, the Python version
      ## and the kernel mode, such as .coverage.linux-3.13-compiled, so the files of all jobs have different names.
      - run: uv run nox -s "tests(${{ matrix.kernels }})"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.kernels }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error

  ## Line and branch coverage of all test jobs combined, which must be 100 % (D02.8).
  coverage:
    name: Coverage (combined, 100 % required)
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
      - run: uv run nox -s coverage

  ## The test suite against the lowest dependency versions pyproject.toml allows, so that the declared lower bounds are
  ## known to hold (D01.6).
  lowest-versions:
    name: Tests with lowest allowed dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
      - run: uv sync --resolution lowest-direct
      - run: uv run --no-sync pytest

  ## The tests that ship inside the wheel, run against an installed copy of that wheel rather than the source tree, and
  ## installed with the test extra exactly as a user would (D01.4, D02.7).
  package:
    name: Build and test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      ## Release builds are isolated: a clean build environment, not the project's .venv (which this job does not have).
      - run: uv build --build-isolation
      - run: uv run --isolated --no-project --with "$(echo dist/*.whl)[test]" pytest --pyargs mhdpy
      - run: uv run --isolated --no-project --with "$(echo dist/*.whl)[test]" pytest --pyargs mhdpy
        env:
          MHDPY_KERNELS: uncompiled
