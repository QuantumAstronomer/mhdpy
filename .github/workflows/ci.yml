## Continuous integration of mhdpy (decision brief D01). Runs on every push to main and on every pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

## A newer push to the same branch or pull request cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ## Formatting, linting and type checking (D01.7, D01.8). These do not depend on the platform, so Linux suffices.
  checks:
    name: Format, lint and type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run pyright

  ## The fast test tier (D02.5) on both target platforms and every supported Python version (D01.1, D01.2). Coverage is
  ## measured here but enforced only after the measurements of all jobs are combined, in the coverage job (D02.8).
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report= --cov-fail-under=0
        env:
          COVERAGE_FILE: .coverage.${{ matrix.os }}-${{ matrix.python }}
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: .coverage.${{ matrix.os }}-${{ matrix.python }}
          include-hidden-files: true
          if-no-files-found: error

  ## Line and branch coverage of all test jobs combined, which must be 100 % (D02.8).
  coverage:
    name: Coverage (combined, 100 % required)
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
      - run: uv run coverage combine
      - run: uv run coverage report

  ## The test suite against the lowest dependency versions pyproject.toml allows, so that the declared lower bounds are
  ## known to hold (D01.6).
  lowest-versions:
    name: Tests with lowest allowed dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
      - run: uv sync --resolution lowest-direct
      - run: uv run --no-sync pytest

  ## The tests that ship inside the wheel, run against an installed copy of that wheel rather than the source tree, and
  ## installed with the test extra exactly as a user would (D01.4, D02.7).
  package:
    name: Build and test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv build
      - run: uv run --isolated --no-project --with "$(echo dist/*.whl)[test]" pytest --pyargs mhdpy
